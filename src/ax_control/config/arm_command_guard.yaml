# arm_command_guard 설정(개발용 잠정값). 물리 위치 한계는 URDF(robot_description)에서 읽고 바꾸지 않는다.
# 단위: rad, rad/s, s. 팔 5축 순서: column_yaw, shoulder, elbow, wrist, gripper_rotation.
/**/arm_command_guard:
  ros__parameters:
    # 명령 가능 범위 = 물리 한계에서 양쪽 각각 이만큼 안쪽.
    margins_rad: [0.02, 0.02, 0.02, 0.02, 0.02]
    # 빈 값이면 ax_description 설치본 config/arm_joint_limits.yaml(속도·가속도 계획값)을 쓴다.
    joint_limits_file: ''
    # 감속 시작 판단: 남은 거리 - (속도×반응 시간 + 속도²/(2×최대 가속도) + 추종 오차 여유)
    # < 최소 여유이면 감속 정지한다. 반응 시간은 상태 주기·명령 전달·제어 주기 지연의 여유다.
    # 2026-10-25 격리 Gazebo 측정(어깨 하한, 0.1~0.5 rad/s): 보호 판단 → 감속 시작 0.014~0.020 s,
    # 정지 거리는 등감속 계산과 일치. 측정 최대값의 2.5배인 0.05 s를 개발용 잠정값으로 둔다.
    reaction_time_s: 0.05
    tracking_allowance_rad: 0.01
    min_clearance_rad: 0.005
    # 물리 한계까지 남은 거리가 이 값 이하이면 한계 도달(고장 잠금)로 본다.
    fault_clearance_rad: 1.0e-6
    # 관절 속도가 이 배수 × max_velocity를 넘는 표본은 비정상으로 보고 보호 판단에 쓰지 않는다
    # (상태 이상으로 처리). DART가 URDF velocity를 강제하므로 실제 운동은 이 값을 넘지 않는다.
    velocity_plausibility_factor: 1.25
    # 한계 쪽 속도가 이 값 이하이면 접근 중이 아닌 것으로 본다.
    still_velocity_rad_s: 0.01
    # joint_states 수신이 이 시간보다 오래 끊기면 신규 조작을 막는다(수신 시각, 단조 시계 기준).
    # header.stamp가 직전보다 이 시간 이내로 과거면 순서가 뒤바뀐 메시지로 보고 버리고,
    # 더 크게 과거면 발행 쪽 시계 재설정으로 보고 받아들인다(stamp_jump_back 이벤트).
    stale_timeout_s: 0.5
    # 보호 정지: 관절마다 자기 최대 가속도로 등감속해 멈추고(먼저 멈춘 관절은 유지), 이 시간보다
    # 빨리 멈출 느린 관절만 이 시간에 멈춘다(감속도는 더 작아짐). 다른 관절의 정지 시간은 늘리지 않는다.
    stop_minimum_time_s: 0.01
    # 정지 확인: 내부 정지 목표가 성공으로 끝난 뒤 받은 관절 속도가 모두 이 값 이하이면 보호 유지로 본다.
    stop_confirm_velocity_rad_s: 0.01
    # 정지 확인 제한시간: 계획 정지 시간 + 이 값 안에 확인하지 못하면 정지 실패(고장 잠금)로 본다.
    # 내부 정지 목표의 거부·중단·취소·통신 예외는 즉시 정지 실패로 본다.
    stop_confirm_timeout_s: 1.0
