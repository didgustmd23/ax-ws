# 모든 로봇이 함께 쓰는 제어기 설정. 모델별 값(바퀴 기하·팔)은 ax1_controllers.yaml(robot_1 계열, 팔 있음)과
# ax2_controllers.yaml(robot_2 계열, 적재함)에 둔다. gz_ros2_control이 이 파일 다음에 모델별 파일을 읽는다.
# /**/는 모든 namespace에 적용한다는 뜻이다. 그래서 /ax/robot_<n> 어디서든 같은 설정을 쓴다.
# 길이 m, 각도 rad, 시간 s.
/**/controller_manager:
  ros__parameters:
    # 제어 주기(Hz).
    update_rate: 100

    # 관절 상태를 joint_states 토픽으로 발행한다.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 바퀴 제어기 종류 등록. 바퀴 기하는 모델별 파일에 있다.
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# 바퀴 제어기 공통값. 입력 cmd_vel(TwistStamped), 출력 odom과 TF odom→base_link.
# 운영에서는 A4 게이트만 cmd_vel을 보낸다(INTERFACE_CONTRACT 4.3절).
/**/diff_drive_controller:
  ros__parameters:
    left_wheel_names: [front_left_wheel_joint, rear_left_wheel_joint]
    right_wheel_names: [front_right_wheel_joint, rear_right_wheel_joint]
    # tf_frame_prefix 값은 로봇마다 달라서 launch가 넘긴다. 여기에 고정하지 않는다.
    tf_frame_prefix_enable: true
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
    # 명령이 끊긴 뒤 제어기가 스스로 멈추는 시간(s). A4 게이트의 0.2 s 만료 뒤에서 받치는 값이다.
    cmd_vel_timeout: 0.5
