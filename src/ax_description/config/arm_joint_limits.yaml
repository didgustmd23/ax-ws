# AX 5축 v0.1 계획용 제한값(rad, rad/s, rad/s^2). 개발용 설정값이다.
# 속도는 ax.urdf.xacro의 관절 <limit>에도 적혀 있다.
# ax_control의 arm_command_guard가 이 파일을 읽어, 공개 팔 명령의 보간 경로가 관절별 속도·
# 가속도를 넘으면 거부하고, 보호 정지의 감속도로 max_acceleration을 쓴다. 궤적의 시간을
# 대신 정해 주지는 않으며(시간 재설정 없음), TCP 속도는 강제하지 않는다.
# controller_manager의 enforce_command_limits는 설정하지 않아(Jazzy 기본값 false) ros2_control
# 자체는 명령을 제한하지 않는다. 물리 시뮬레이션에서는 URDF 위치 한계와 effort 상한이 걸리고,
# URDF velocity는 gz-physics가 DART 속도 한계로 넘겨 강제한다(위치 한계에 닿지 않았을 때).
joint_limits:
  column_yaw_joint:
    has_velocity_limits: true
    max_velocity: 0.35
    has_acceleration_limits: true
    max_acceleration: 0.50
  shoulder_joint:
    has_velocity_limits: true
    max_velocity: 0.50
    has_acceleration_limits: true
    max_acceleration: 0.50
  elbow_joint:
    has_velocity_limits: true
    max_velocity: 0.50
    has_acceleration_limits: true
    max_acceleration: 0.70
  wrist_joint:
    has_velocity_limits: true
    max_velocity: 0.70
    has_acceleration_limits: true
    max_acceleration: 1.00
  gripper_rotation_joint:
    has_velocity_limits: true
    max_velocity: 0.70
    has_acceleration_limits: true
    max_acceleration: 1.00
