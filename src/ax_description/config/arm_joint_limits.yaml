# AX 5축 v0.1 계획용 제한값(rad, rad/s, rad/s^2). 설정값일 뿐이다.
# 속도는 ax.urdf.xacro의 관절 <limit>에도 적혀 있다.
# 현재 ros2_control 경로(arm_controller -> gz_ros2_control)에서는 이 파일을 읽는 노드가
# 없어 가속도와 TCP 속도를 강제하지 않는다. arm_controller는 호출자가 정한 궤적 시간을
# 따르고, controller_manager의 enforce_command_limits를 설정하지 않아(Jazzy 기본값 false)
# ros2_control도 URDF 속도로 명령을 제한하지 않는다.
# 시뮬레이션에서 실제로 걸리는 것은 URDF 위치 범위(Gazebo 관절 한계)와 속도 명령의 힘
# 상한인 URDF effort다. Gazebo가 URDF velocity를 적용하는지는 확인하지 않았다.
# 이후 궤적 계획기가 joint_limits를 읽어 경로의 시간을 정해야 한다.
joint_limits:
  column_yaw_joint:
    has_velocity_limits: true
    max_velocity: 0.35
    has_acceleration_limits: true
    max_acceleration: 0.50
  shoulder_joint:
    has_velocity_limits: true
    max_velocity: 0.50
    has_acceleration_limits: true
    max_acceleration: 0.50
  elbow_joint:
    has_velocity_limits: true
    max_velocity: 0.50
    has_acceleration_limits: true
    max_acceleration: 0.70
  wrist_joint:
    has_velocity_limits: true
    max_velocity: 0.70
    has_acceleration_limits: true
    max_acceleration: 1.00
  gripper_rotation_joint:
    has_velocity_limits: true
    max_velocity: 0.70
    has_acceleration_limits: true
    max_acceleration: 1.00
