# 직접 사용하는 시험 제어기 설정이다. 공통 robot_test 런치는 로봇 namespace별 설정을 별도로 생성하므로 서로 구분한다.
controller_manager:
  ros__parameters:
    update_rate: 100

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

ax_1_arm_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - column_yaw_joint
      - shoulder_joint
      - elbow_joint
      - wrist_joint
      - gripper_rotation_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
