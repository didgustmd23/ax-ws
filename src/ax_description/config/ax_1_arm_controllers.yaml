controller_manager:
  ros__parameters:
    update_rate: 100

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

ax_1_arm_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - arm_turret_column_joint
      - arm_shoulder_joint
      - arm_03_shoulder_pitch_joint
      - arm_04_elbow_joint
      - gripper_wrist_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
