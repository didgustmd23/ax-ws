controller_manager:
  ros__parameters:
    update_rate: 100

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

ax_1_arm_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - column_yaw_joint
      - shoulder_joint
      - elbow_joint
      - wrist_joint
      - gripper_rotation_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
