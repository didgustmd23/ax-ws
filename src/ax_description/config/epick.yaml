# 다중 흡착판 · 12컵 설정(epick은 호환 이름). 질량 kg, 길이/오프셋 m, 회전 rad. ToF lip_offset은 센서 원점에서 컵 끝면까지이며 흡착 성공 판정이 아니다.
# 참고 사진을 바탕으로 만든 12컵 비교 모델. 실물 제품 사양이 아니다.
body_mass_kg: 0.87086427304
cup_mass_kg: 0.04
# 컵 하나의 지름 28mm. 하우징과 컵 길이의 합은 기존 0.1173m를 유지한다.
cup_radius_m: 0.014
cup_height_m: 0.0223
body_length_m: 0.095
head_visual:
  width_m: 0.170
  depth_m: 0.130
  housing_top_m: 0.045
  columns: 4
  rows: 3
  pitch_m: 0.036
tcp_stroke_compensation_m: 0.0
# 본체는 헤드 바깥에 두고 광선은 안쪽으로 20도 기울인다.
# TCP 정렬 0.2m 상자의 접촉면부터 0.3m 앞까지 광선이 표면 안에 든다.
tof_xyz: '0.105 0 0.095'
tof_rpy: '0 -1.9198621771937625 0'
# 컵 평면까지 광선상의 거리. 평면 법선 간격=(raw-lip_offset)*normal_cosine.
tof_lip_offset_m: 0.0237311643262128
tof_normal_cosine: 0.9396926207859084

# generate_parcel_suction_head.py가 Robotiq 기본 손가락 자세·무부하에 맞춰 아래 값을 생성한다.
# 컵 0.04kg·ToF 0.01kg을 포함한 공구 합계는 0.92086427304kg이다.
# 아래 원점·관성은 epick_body 좌표계 기준이다. 집게·컵·ToF 구성을 바꾸면 재계산한다.
body_com_xyz: -0.0012156295093026267 -4.5400619153766084e-05 -0.017117035958443827
body_inertia:
  ixx: 0.0009507749588092943
  iyy: 0.0016009749901001883
  izz: 0.0009379656764845364
  ixy: 4.118555662249117e-06
  ixz: 6.805917729073292e-05
  iyz: 2.729231340992063e-06
