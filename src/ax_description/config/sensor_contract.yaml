# 센서 토픽/형식/유효성의 공통 계약이다. 센서 장착 위치는 sensor_mounts.yaml에서 관리한다.
# W1 sensor baseline. SI units, ideal Gazebo measurements, no calibrated hardware noise.
# Geometric extrinsics are in sensor_mounts.yaml; CameraInfo is the intrinsic source.
schema_version: 2
topic_root: /ax/{robot_id}/sensors
frame_root: '{robot_id}/'
qos: {reliability: best_effort, durability: volatile, depth: 5}
clock: {stamp: sim_time, use_sim_time: true}
cameras:
  width: 640
  height: 480
  horizontal_fov_rad: 1.0471975511965976
  rate_hz: 15
  rgb_encoding: rgb8
  optical_axes: {right: '+X', down: '+Y', forward: '+Z'}
  body_axes: {forward: '+X', left: '+Y', up: '+Z'}
  rgb_names: {manipulator: [front_rgb, arm_rgb], transporter: [front_rgb]}
  rgbd_names: {manipulator: [front_rgbd, arm_rgbd], transporter: [front_rgbd]}
  rgb_suffixes: [image_raw, camera_info]
  rgbd_suffixes: [image, depth_image, points, camera_info]
  depth_unit: m
  depth_clip_m: [0.05, 5.0]
  processed_rgbd_suffixes: [processed/image, processed/depth_image, processed/camera_info, processed/points]
  processed_points_axes: {right: '+X', down: '+Y', forward: '+Z'}
  # Harmonic 원시 points는 축/투영이 CameraInfo와 맞지 않을 수 있으므로
  # 3D 소비자는 B1이 깊이와 CameraInfo로 재생성한 processed/points를 사용한다.
lidar:
  names: [front_lidar, rear_lidar]
  rate_hz: 10
  samples: 360
  horizontal_fov_rad: 3.141592653589793
  range_m: [0.12, 10.0]
  suffix: scan
imu: {rate_hz: 100, suffix: imu}
tool_tof:
  role: manipulator
  tools: [epick, suction]
  simulated_sources: {epick: epick_tof/scan, suction: suction_tof/scan}
  simulated_type: sensor_msgs/msg/LaserScan
  raw_topic: tool_tof/raw
  raw_type: sensor_msgs/msg/Range
  frame: tool_tof_link
  rate_hz: 30
  range_m: [0.02, 0.40]
  lip_offset_m: {epick: 0.0223, suction: 0.031}
  invalid: NaN
  too_far: '+inf'
  too_close: '-inf'
  semantics: distance_from_sensor_origin_not_suction_success
  processed_topic: tool_tof
  processed_status: B1_input_validation_implemented
  # B1 기본 동작: robot_description의 base_link visual OBJ와 측정 시각 TF로
  # ToF +X 광선의 차체 교차 거리를 계산한다. 원본 raw는 변경하지 않는다.
  # 차체보다 5 mm 이상 가까운 관측은 유지하고, 차체 반사/차체 뒤 관측은
  # processed에서 NaN + sensors/health ERROR로 표시한다. 경계 5 mm는 판별 불가다.
  # 모델/TF가 없을 때도 NaN이다. 맑은 광선의 +inf, 가까운 -inf 의미는 유지한다.
  # 팔/공구 전체 자기 필터나 위험 판정·정지·흡착 성공 판단을 대체하지 않는다.
cargo_contact:
  role: transporter
  suffix: cargo_contact
  type: ros_gz_interfaces/msg/Contacts
  sensor_mount_frame: cargo_contact_link
  positions_frame: world
  ros_header_frame: may_be_empty_identify_source_by_robot_topic_and_collision_entities
  task_frame: cargo_link
  rate_hz: 30
  semantics: raw_contact_not_load_state
