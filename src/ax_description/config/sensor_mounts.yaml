# Development mounts, SI units (m, rad), parent-link coordinates. These are not
# calibrated product specifications. FOV/occlusion must be checked at actual work poses.
# rpy is URDF fixed-axis roll-pitch-yaw; every camera/LiDAR link looks along its own +X.
ax1:
  # Body front row, base_link frame, all facing robot +X at the same height Z=0.20:
  # front_rgb (Y=+0.10) - front_lidar (Y=0) - front_rgbd (Y=-0.10).
  # The LiDAR sits 0.04 m ahead of the cameras so its +/-90 deg scan plane passes
  # in front of the camera bodies (camera front face X=0.755 < LiDAR origin X=0.77).
  front_lidar: {xyz: '0.77 0 0.20', rpy: '0 0 0'}
  rear_lidar: {xyz: '-0.73 0 0.06', rpy: '0 0 3.141592653589793'}
  front_rgbd: {xyz: '0.73 -0.10 0.20', rpy: '0 0 0'}
  front_rgb: {xyz: '0.73 0.10 0.20', rpy: '0 0 0'}
  imu: {xyz: '0 0 -0.10', rpy: '0 0 0'}
  # Surface RGB-D for the suction tool (gripper_model:=suction), wrist_link frame (origin on the
  # wrist axis; tool axis along -Z, suction lips at z -0.356 when the roll is any value).
  # Outer (+Y) side, 0.18 m off the tool axis and 0.20 m below the wrist axis, clear of the
  # forearm and of the plate swept by the gripper roll. Optical axis aimed at (0, 0.13, -0.356):
  # the box top just outside the cups, so the centre pixel sees the object, not the plate.
  # Role: object surface/height/surroundings before contact. Final approach distance is the
  # plate-centre ToF below. The bracket to the wrist housing is not modelled.
  arm_rgbd:
    parent: wrist_link
    xyz: '0 0.18 -0.20'
    rpy: '3.141592653589793 1.2606 -1.5707963267948966'
  # Tools without suction_base_link (primitive, robotiq, parallel_wide) keep the previous
  # wrist mount: wrist_link frame, outer (+Y) side, optical axis tilted 23.7 deg inward
  # from -Z toward the tool axis. It does not turn with the gripper roll.
  arm_rgbd_non_suction:
    parent: wrist_link
    xyz: '0 0.13 -0.18'
    rpy: '0 1.1570 -1.5707963267948966'
  # Plate-centre ToF for the suction tool only, suction_base_link frame (plate top origin,
  # +Z toward the object; plate z 0..0.025, cup lips z 0.062). Link +X (the single ray) points
  # along +Z. The 0.012 x 0.02 x 0.02 m body hangs under the plate (z 0.025..0.037), between
  # the cup necks, so it neither overlaps the plate nor protrudes past the lips.
  # ROS: 1-beam sensor_msgs/LaserScan on .../suction_tof/scan; ranges[0] is measured from the
  # sensor origin (z 0.031). lip_offset = 0.062 - 0.031 = 0.031 m, so ranges[0] - lip_offset is
  # the centre-ray gap to the UNDEFORMED cup-lip plane: not contact of all four cups and not a
  # suction success. At contact the raw value is about lip_offset, not 0. No return stays inf.
  # min/max_range are development assumptions covering pre-grasp (gap 0.15 m) to contact.
  suction_tof:
    parent: suction_base_link
    xyz: '0 0 0.031'
    rpy: '0 -1.5707963267948966 0'
    min_range: 0.02
    max_range: 0.50
    lip_offset: 0.031
  # Upper-arm RGB, upper_arm_link frame (origin on the shoulder axis), +Y face near the
  # lower end. Position kept (z 0.25/0.35 m on the same face scored lower). Orientation C of
  # three compared at this position: optical axis toward a point 0.10 m inboard of and 0.10 m
  # below the median suction grasp point of the development pick-path poses (upper_arm_link
  # 0.222, 0.745, 0.317), image rolled +30 deg about the optical axis. Chosen for the fewest
  # contact / early-lift failures while keeping most of the low front-table view.
  # Observation of the cup/box-top scene only, not a contact or suction success check.
  arm_rgb:
    parent: upper_arm_link
    xyz: '0.05 0.142 0.15'
    rpy: '2.1677 -0.2604 1.2929'
ax2:
  # Same camera-LiDAR-camera row as ax1 at Z=0.14, LiDAR 0.04 m ahead of the cameras.
  front_lidar: {xyz: '0.61 0 0.14', rpy: '0 0 0'}
  rear_lidar: {xyz: '-0.57 0 0.02', rpy: '0 0 3.141592653589793'}
  front_rgbd: {xyz: '0.57 -0.10 0.14', rpy: '0 0 0'}
  front_rgb: {xyz: '0.57 0.10 0.14', rpy: '0 0 0'}
  imu: {xyz: '0 0 -0.08', rpy: '0 0 0'}
