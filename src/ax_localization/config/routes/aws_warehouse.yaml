# B2 지도 작성 경로(AWS 창고, robot_2). 개발용 시험 경로이며 운영 주행 경로가 아니다.
# 경유점은 frame 기준 좌표(m)다. map과 Gazebo world가 같다고 가정하지 않는다.
# robot_2/odom 원점은 제어기가 시작한 순간의 차체 위치다(AWS 월드 launch 출발 위치 world (-1.0, -2.3), yaw 0.
# robot_test.launch.py WORLD_SPAWN_POSITIONS. 기본 출발 (2.5, -1.5)은 선반 충돌과 겹쳐 2026-11-09에 옮겼다).
# world 좌표는 경로를 설계할 때 쓴 참고값이며 주행·SLAM 입력으로 쓰지 않는다.
world: aws_warehouse.world
robot_id: robot_2
frame: robot_2/odom

# 주행 상한. 실행 중인 diff_drive_controller 제한과 비교해 작은 값을 쓴다.
limits:
  linear_m_s: 0.3
  angular_rad_s: 0.3

# 경유점 도달·방향 판단
goal_tolerance_m: 0.15
heading_tolerance_rad: 0.12        # 이보다 크게 틀어지면 제자리 회전 먼저

# 차체 외곽(base_link 기준 사각형, m). A1이 제공한 robot_2 선반 포함 여유 외곽
# (ax_description/config/a1_validation.yaml mobility.robot_2.footprint_xy_m: x [-0.62, 0.66], y ±1.03).
# 실제 collision 외곽은 x [-0.60, 0.64], y [-1.001, 0.995]다. 차체 폭(이전 가정 0.50)만 쓰면 선반이 부딪힌다.
# 좌우가 같지 않은 외곽이 아니라 좌우 대칭 half_width로 둔다(1.03 = 둘 중 큰 쪽).
footprint:
  front_m: 0.66
  rear_m: 0.62
  half_width_m: 1.03

# 장애물 정지 거리 = 속도²/(2·감속) + 속도·처리 지연 + 여유
safety:
  processing_latency_s: 0.3
  margin_m: 0.25
  rotation_margin_m: 0.15          # 제자리 회전 시 외곽 원 바깥 여유

# 입력 만료(시뮬레이션 s): 넘으면 정지하고, input_timeout_s 동안 회복하지 않으면 중단한다.
# SLAM은 세 항목을 구분한다.
# - 이 로봇 map→odom의 수신 경과: CLOCK_BOOTTIME 기준 tf_receive_max_age_boottime_s(개발 출발값 2.0 s).
#   이전 0.5 s 기준은 sim time이었고, 짧은 조건 A(2026-11-06 22:12)에서 sim time 최대 0.93 s 공백이 있었다.
# - 스캔 최신성: sim time 기준 scan_max_age_s
# - 처리 진척: 마지막 변환 시각 갱신 뒤 odom 이동이 slam_progress_* 초과면 정지. slam_mapping.yaml의
#   minimum_travel_distance·heading(0.5 m·0.5 rad)의 두 배로 둔다.
inputs:
  scan_max_age_s: 0.5
  odom_max_age_s: 0.3
  # 2.0 s 출발값으로 시험한 결과(2026-11-06 23:04·23:06, AWS 사본, RTF 약 0.4) 수신 간격은 p99 0.02 s였지만
  # 실행마다 1~3회 2.44~2.58 s 공백이 있어 2.0 s로는 부족했다. 관측 최대의 약 1.5배인 4.0 s로 둔다.
  tf_receive_max_age_boottime_s: 4.0
  slam_progress_distance_m: 1.0
  slam_progress_heading_rad: 1.0
  input_timeout_s: 10.0

# 경유점별 진척 감시: 제한시간 = 거리/상한 × time_factor + time_margin_s
progress:
  time_factor: 3.0
  time_margin_s: 30.0
  stall_window_s: 15.0             # 이 시간 동안 거리·방향 오차가 줄지 않으면 중단
  stall_min_improvement: 0.05      # 거리(m) 또는 방향(rad) 최소 개선량

# 루프 기준점 복귀 판정(odom 기준)
# 루프 폐쇄 기준: loop_waypoint(1부터)번 경유점에 다시 돌아왔는지(odom).
loop_waypoint: 1
return_tolerance_m: 0.3

# 경로(2026-11-09, 선반 포함 외곽 기준으로 다시 설계): 출발(중앙 빈 공간) → 동쪽 통로(x_world 1.0) 남쪽 끝 →
# 북쪽 끝 → 중앙 동서 통로(y_world -3.3) 서쪽 x_world -2.6 → 출발 → 경유점 1로 복귀(루프 폐쇄).
# 선반 포함 폭 2.06 m로는 서쪽 통로(x_world -3.6, 측면 여유 0.09 m)와 북쪽 횡단(y_world 0.2, 0.03 m)을
# mapping_drive.py 장애물 규칙(측면 half_width + margin, 회전 외접원 + rotation_margin)으로 지날 수 없어 뺐다.
# 그쪽은 지나가며 LiDAR(10 m)로 관측한다. 설계 검사는 개발 지도 회차 20261108_131510의 참조 지도(단순화 월드
# light_collision 기준, 점유·미관측을 장애물로 봄)로 했고 모든 구간 전방 통로 장애물 0, 측면 여유 최소 +0.64 m,
# 회전 원 여유 최소 +0.30 m였다. 원본 월드 회차 20261109_085358의 참조 지도로 같은 검사를 다시 하면(별도 분석)
# 전방 통로 장애물 0, 측면 여유 최소 +0.63 m, 회전 원 여유 최소 +0.30 m다. 두 값은 서로 다른 지도·월드 조건이다.
# 참조 지도는 앞 LiDAR 높이 관측이므로 다른 높이의 충돌은 Gazebo 시험으로 따로 확인한다.
# 2026-11-09 원본 월드 시험: 동서 통로를 x_world -5.0까지 가면 앞 LiDAR 평면(바닥 약 0.44 m)보다 낮은 충돌물에
# 차체 앞이 x_world 약 -4.45에서 막히거나 타고 올라(z 0.30 → 0.44 m) 뒤 LiDAR가 바닥을 보고 회전이 막혔다.
# 충돌물은 특정하지 못했다(가장 가까운 모델 ShelfF_01_001, world (-5.8, -0.96)). 그래서 서쪽 끝을 x_world -2.6으로
# 줄여 제자리 회전 원(1.37 m) 서쪽 끝이 -3.97이 되게 한다. 그 서쪽은 LiDAR(10 m)로 관측한다.
waypoints:
  - [2.0, 0.0]      # world (1.0, -2.3)
  - [2.0, -5.8]     # world (1.0, -8.1)
  - [2.0, 3.8]      # world (1.0, 1.5)
  - [2.0, -1.0]     # world (1.0, -3.3)
  - [-1.6, -1.0]    # world (-2.6, -3.3)
  - [0.0, -1.0]     # world (-1.0, -3.3)
  - [0.0, 0.0]      # world (-1.0, -2.3), 출발
  - [2.0, 0.0]      # world (1.0, -2.3), 경유점 1 재방문
